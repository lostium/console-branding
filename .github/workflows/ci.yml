name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # El paquete se instala desde git, así que el dist/ commiteado es lo que
      # llega a los proyectos. Si no coincide con el src/ de este commit, los
      # consumidores recibirían código viejo sin enterarse.
      - name: Comprobar que dist/ está sincronizado con src/
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::El dist/ commiteado no coincide con el compilado desde src/. Ejecuta 'pnpm build' y commitea el resultado."
            exit 1
          fi
